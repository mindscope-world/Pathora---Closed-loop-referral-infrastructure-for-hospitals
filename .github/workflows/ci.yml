name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pathora, POSTGRES_PASSWORD: pathora, POSTGRES_DB: pathora }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pathora -d pathora" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway values for the test run only. Tests create and drop their own database.
      DATABASE_URL: postgresql://pathora:pathora@localhost:5432/pathora
      APP_URL: http://localhost:3000
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdef012345
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: Type-check frontend and server
        run: npm run lint && npm run lint:server
      - name: Migrations apply cleanly and match the schema
        run: |
          npx prisma migrate deploy
          # Fails if schema.prisma has changes that no migration creates (someone forgot `prisma migrate dev`).
          npx prisma migrate diff --from-config-datasource --to-schema server/db/schema.prisma --exit-code
      - run: npm test
      - run: npm run build && npm run build:server
      - name: Dependency audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime and migrate images
        run: |
          docker build --target runtime -t pathora:ci .
          docker build --target migrate -t pathora-migrate:ci .
      - name: Smoke test the runtime image (it refuses to start on placeholder secrets)
        run: |
          ! docker run --rm -e DATABASE_URL=postgresql://x:y@localhost:5432/z -e APP_URL=https://example.org \
            -e JWT_SECRET=replace-me-with-at-least-32-random-characters -e COOKIE_SECRET=replace-me-with-at-least-32-random-characters \
            -e FIELD_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= pathora:ci
