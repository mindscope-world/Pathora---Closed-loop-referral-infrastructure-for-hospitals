# Local development services. Not for production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pathora-postgres
    environment:
      POSTGRES_USER: pathora
      POSTGRES_PASSWORD: pathora
      POSTGRES_DB: pathora
    ports:
      - '127.0.0.1:5432:5432'   # bound to localhost only
    volumes:
      - pathora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pathora -d pathora']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pathora_pgdata:
